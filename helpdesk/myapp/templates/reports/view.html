{% extends "base.html" %}
{% block content %}

<h5 class="mb-3">Report Result</h5>

<table class="table table-bordered table-hover">
<thead class="table-primary">
<tr>
<th>ID</th><th>Title</th><th>User</th>
<th>Status</th><th>Created</th><th>Reward</th>
</tr>
</thead>

<tbody>
{% for t in tasks %}
<tr>
<td>{{ t.id }}</td>
<td>{{ t.title }}</td>
<td>{{ t.created_by.username }}</td>
<td>{{ t.task_status }}</td>
<td>{{ t.created_on|date:"d M Y" }}</td>
<td>₹ {{ t.reward }}</td>
</tr>
{% empty %}
<tr><td colspan="6" class="text-center">No Data</td></tr>
{% endfor %}
</tbody>

</table>

{% endblock %}
